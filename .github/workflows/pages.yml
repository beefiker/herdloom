name: Website
# Builds site/ into the GitHub Pages site (https://beefiker.github.io/herdloom/) on every push to
# main: the page, and the browser demo, which is the app itself, so any client change is a site
# change (docs/development.md, "Website").
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # the demo is a Vite build of the client
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-site.ts
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
